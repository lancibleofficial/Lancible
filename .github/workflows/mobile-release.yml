name: Build Android APK

# Собирает APK через EAS Build (облачные сборщики Expo) и публикует его
# ассетом GitHub Release. Отдельно от .github/workflows/release.yml, потому
# что там десктоп: другие раннеры, другой тег, другой цикл выпуска.
#
# Раздаёт APK (~96 МБ) Cloudflare R2, а не GitHub: у GitHub Releases скорость
# скачивания ~19 КБ/с (замер 10 октября 2026), у Cloudflare ~18 МБ/с. Файл
# заливается в бакет R2 по пути mobile-v<версия>/Lancible-<версия>.apk (тот же
# <тег>/<файл>, что у десктопа), проверяется запросом HEAD, а в конце печатается
# готовый блок "android" для latest.json репозитория lancible-updates — его
# по-прежнему правят руками. GitHub Release остаётся архивом. Секреты те же,
# что у release.yml: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
# R2_BUCKET, R2_PUBLIC_URL; пока их нет, выпуск идёт по-старому. Релиз,
# вышедший без R2, переводит .github/workflows/mirror-release.yml.
#
# Почему именно EAS, а не gradle на раннере: подписывать APK надо ТЕМ ЖЕ
# ключом, что и предыдущие версии, иначе Android откажется ставить новую
# поверх старой и пользователю придётся сносить приложение с потерей данных.
# Ключ лежит на стороне EAS и переиспользуется автоматически; воспроизвести
# его в CI нельзя, да и не нужно.
#
# Нужен секрет репозитория EXPO_TOKEN — токен доступа Expo:
# expo.dev → Account settings → Access tokens → Create token.
#
# Третий способ запуска — из .github/workflows/publish.yml (выпуск кнопкой), как
# workflow_call с тегом: тег, запушенный GITHUB_TOKEN, сам этот workflow не
# запускает, так что сборка одна. checkout берёт ref из входа (в вызванном
# workflow github.sha — коммит ещё без новой версии в app.json), а наружу
# уходит размер APK: им publish.yml сверяет раздачу из R2 и пишет latest.json.
on:
  push:
    tags:
      - 'mobile-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза (например mobile-v1.1.0) — обязателен для ручного запуска'
        required: true
  workflow_call:
    inputs:
      tag:
        description: 'Тег релиза, уже запушенный (mobile-v1.3.2)'
        required: true
        type: string
      ref:
        description: 'Что собирать — тот же тег (refs/tags/mobile-v1.3.2)'
        required: true
        type: string
    secrets:
      EXPO_TOKEN:
        required: false
      R2_ACCOUNT_ID:
        required: false
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
      R2_BUCKET:
        required: false
      R2_PUBLIC_URL:
        required: false
    outputs:
      apk_bytes:
        description: 'Размер APK в байтах'
        value: ${{ jobs.build.outputs.apk_bytes }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      apk_bytes: ${{ steps.apk.outputs.bytes }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # aws cli новых версий добавляет к запросам контрольные суммы, которых R2
      # не понимает, — просим считать их только там, где без них нельзя.
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      # inputs.ref задан только при вызове из publish.yml; пустой — как раньше.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Проверить, что токен Expo задан
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Нет секрета EXPO_TOKEN. expo.dev → Account settings → Access tokens → Create token, затем добавить секрет в репозиторий."
            exit 1
          fi

      # Тег идёт в оболочку через переменную, а не подстановкой в текст команды.
      - name: Определить тег и версию
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          version=$(node -p "require('./mobile/app.json').expo.version")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Тег и версия в app.json обязаны совпадать: имя файла ниже собирается
          # из версии, а ссылка на лендинге — из тега. Разойдутся — ссылка
          # укажет в пустоту, и это выяснится уже после публикации.
          if [ "$tag" != "mobile-v$version" ]; then
            echo "::error::Тег $tag не совпадает с версией $version из mobile/app.json — ожидался mobile-v$version"
            exit 1
          fi

      # Сама сборка идёт в облаке Expo, локальные зависимости для неё не нужны,
      # но EAS CLI по ним определяет версию SDK и конфигурацию проекта.
      - name: Установить зависимости мобильного проекта
        working-directory: mobile
        run: npm ci

      - name: Собрать APK на EAS
        id: build
        working-directory: mobile
        run: |
          # --wait держит шаг до конца сборки, --json отдаёт машиночитаемый
          # результат. Профиль preview собирает именно apk (в production —
          # aab для Google Play, его нельзя поставить напрямую с сайта).
          npx eas-cli@latest build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > build.json
          url=$(node -p "const b=require('./build.json'); const x=Array.isArray(b)?b[0]:b; x.artifacts?.applicationArchiveUrl || x.artifacts?.buildUrl || ''")
          if [ -z "$url" ]; then
            echo "::error::EAS не вернул ссылку на артефакт"
            cat build.json
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Скачать APK под нужным именем
        id: apk
        run: |
          name="Lancible-${{ steps.meta.outputs.version }}.apk"
          curl -fsSL "${{ steps.build.outputs.url }}" -o "$name"
          ls -la "$name"
          # Проверка, что это действительно APK: zip-архив начинается с PK.
          head -c 2 "$name" | grep -q 'PK' || { echo "::error::Скачанный файл не похож на APK"; exit 1; }
          echo "APK_NAME=$name" >> "$GITHUB_ENV"
          echo "bytes=$(stat -c %s "$name")" >> "$GITHUB_OUTPUT"

      - name: Опубликовать GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Lancible Mobile v${{ steps.meta.outputs.version }} (Android)
          draft: false
          generate_release_notes: true
          files: ${{ env.APK_NAME }}

      # Куда раздавать APK. Секреты R2 в условиях шагов недоступны (contexts
      # secrets там нет), поэтому наличие всех пяти проверяется здесь и
      # результат читают следующие шаги.
      - name: Проверить, заданы ли ключи Cloudflare R2
        id: r2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          if [ -n "$R2_ACCOUNT_ID" ] && [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ] && [ -n "$R2_BUCKET" ] && [ -n "$R2_PUBLIC_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Секреты Cloudflare R2 заданы не полностью (нужны R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET, R2_PUBLIC_URL) — APK лежит только на GitHub Releases, а он отдаёт ~19 КБ/с."
          fi

      # Путь в бакете — <тег>/<файл>, как у десктопа (scripts/publish-release.js,
      # mobileRelease). Content-Type задан явно: браузер на телефоне по нему
      # понимает, что это установочный пакет. Шаг падает, если загрузка не
      # удалась, — проверка и подсказка про latest.json идут только после него.
      - name: Выложить APK в Cloudflare R2
        if: ${{ steps.r2.outputs.enabled == 'true' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          aws s3 cp "$APK_NAME" "s3://${R2_BUCKET}/${TAG}/${APK_NAME}" \
            --content-type application/vnd.android.package-archive \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

      # HEAD по публичному адресу: файл отвечает 200 и ровно того размера, что
      # собранный APK. Иначе подсказка ниже отправила бы установленные копии на
      # ссылку, которая не открывается (например, если у бакета не включён
      # публичный адрес r2.dev). Сам latest.json отсюда не правится.
      - name: Проверить раздачу и вывести блок для latest.json
        if: ${{ steps.r2.outputs.enabled == 'true' }}
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: node scripts/publish-release.js --mobile-apk "$APK_NAME" --tag "$TAG" --public-url "$R2_PUBLIC_URL"

      - name: Напомнить про манифест обновлений (APK только на GitHub)
        if: ${{ steps.r2.outputs.enabled != 'true' }}
        run: |
          # size — размер файла в байтах: начиная с 1.2.1 приложение сверяет с
          # ним скачанное и недокачанный APK установщику не отдаёт.
          size=$(stat -c %s "$APK_NAME")
          echo "::notice::APK опубликован. Осталось поднять в latest.json репозитория lancible-updates version до ${{ steps.meta.outputs.version }} и size до $size — иначе установленные копии о новой версии не узнают."
